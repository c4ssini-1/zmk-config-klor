# Uncomment these two line to add support for encoders to your firmware
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the KLOR OLED Display
CONFIG_ZMK_DISPLAY=y

# Uncomment the following lines to enable per key RGB
CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP was removed in Zephyr 4.1 -- the symbol no longer exists
# and assigning it aborts the build. See config/klor.conf for the details.
# This file is shadowed by config/klor.conf and is not merged at build time,
# but the line is removed here too so it cannot resurface.
