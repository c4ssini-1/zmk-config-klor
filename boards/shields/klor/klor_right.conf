# Right half only. Merged for klor_right and nothing else -- config/klor.conf
# goes into both halves, because ZMK matches a conf filename against the shield
# DIRECTORY name (klor), not the per-half shield name.
#
# This half is the BLE peripheral. It runs the same keymap display as the left,
# drawing grid columns 6-11 and highlighting its own keys, but it cannot show
# the active layer: ZMK compiles neither src/keymap.c nor
# src/events/layer_state_changed.c into a non-central build, so the layer
# lookup and the layer event do not merely return nothing there, they do not
# link. src/klor_status_screen.c compiles all of that out and draws BASE.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_KLOR_STATUS_SCREEN=y

# Everything below mirrors klor_left.conf, and for the same reasons -- see the
# long comments there. Briefly:
#
# ZMK sets the mono theme, the default font and LV_Z_MEM_POOL_SIZE only inside
# "if ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN", so choosing the custom screen drops
# all of them. The pool must cover the draw tasks that queue up until
# lv_canvas_finish_layer dispatches them; the 1 KB canvas buffer itself is a
# static array and does not come from it.
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_FONT_DEFAULT_UNSCII_8=y
CONFIG_LV_USE_THEME_MONO=y

# RENDER OFF THE SYSTEM WORK QUEUE. This matters at least as much here as on the
# central. The peripheral scans its matrix and ships key positions over BLE from
# the system work queue, so a full canvas repaint plus a full-panel I2C flush
# sitting on that queue would delay the position reports themselves -- the same
# dropped keys and stuck modifiers the left half showed before this was set.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
