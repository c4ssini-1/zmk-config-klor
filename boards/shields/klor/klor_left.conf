# Left half only. This file is merged for klor_left and nothing else, which is
# exactly what the status screen needs -- config/klor.conf goes into both halves.
#
# Why it cannot be shared: ZMK_DISPLAY_STATUS_SCREEN_CUSTOM makes the firmware
# call zmk_display_status_screen(), which src/klor_status_screen.c provides. But
# that source is gated on KLOR_STATUS_SCREEN, which in turn depends on
# ZMK_SPLIT_ROLE_CENTRAL, because the peripheral never runs the keymap and so
# has no active layer to draw. Put the CUSTOM setting in the shared conf and the
# right half selects a custom screen with no implementation behind it, and fails
# to link.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_KLOR_STATUS_SCREEN=y

# These came free from the built-in status screen and must be asked for now:
# ZMK sets them inside "if ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN", so choosing the
# custom screen silently drops the mono theme and leaves LVGL with no default
# font. UNSCII_8 is an 8x8 fixed-width bitmap font; monospace is what makes the
# key grid line up, and 12 columns x 8 px fits inside 128 px comfortably.
# ZMK sets "LV_Z_MEM_POOL_SIZE default 4096 if ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN",
# so the custom screen dropped LVGL's heap to the bare default of 2048. That is
# not enough: lv_obj_create() returns NULL, the screen code dereferences it, and
# the central faults - which shows up as garbage on the panel AND the split
# refusing to connect, because the half driving it is dead.
#
# 8192 rather than 4096 because the screen draws through a canvas layer. Every
# lv_draw_rect/lv_draw_label call mallocs a draw task plus a copy of its
# descriptor, and they all queue up until lv_canvas_finish_layer dispatches
# them, so peak usage scales with the number of keys held: background, keymap
# text, then two tasks per pressed key. Six held keys is around 14 live tasks.
# The 1 KB canvas buffer itself is a static array in klor_status_screen.c and
# does NOT come out of this pool.
CONFIG_LV_Z_MEM_POOL_SIZE=8192

CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_FONT_DEFAULT_UNSCII_8=y
CONFIG_LV_USE_THEME_MONO=y
