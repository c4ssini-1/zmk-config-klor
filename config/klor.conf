# KLOR polydactyl / BLE (nice!nano v2) configuration.
# This file is picked up for both klor_left and klor_right because ZMK matches
# it against the shield *directory* name (klor), not the per-half shield names.

# --- Encoders -----------------------------------------------------------
# Both encoders work now. ZMK forwards sensor events from the peripheral half
# to the central half, so the right encoder is no longer dead as the upstream
# readme claims. Each layer supplies two sensor-bindings entries, left first.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- OLED displays ------------------------------------------------------
# Both halves get ZMK's built-in status screen. The left (central) half shows
# layer, battery, output and profile; the right half is a peripheral and only
# knows its own battery and connection state.
CONFIG_ZMK_DISPLAY=y

# --- RGB ----------------------------------------------------------------
# The KLOR wires 21 SK6812 minis per half as an addressable strip, but ZMK
# only drives it as whole-strip underglow effects -- there is no per-key or
# per-layer control in mainline ZMK, despite the "RGB matrix" naming.
# ### TEMPORARY: LED MAPPING HARNESS ###############################
#
# ZMK's underglow is OFF and src/klor_led_map.c owns the strip instead. Two
# writers on one led_strip device would fight, so this is not optional while
# the harness is enabled.
#
# The &rgb_ug keys on SYS still build -- the behavior node is declared
# unconditionally in ZMK's behaviors.dtsi and only the driver is gated -- but
# they do nothing until underglow is switched back on.
#
# To restore normal RGB: set ZMK_RGB_UNDERGLOW=y, drop KLOR_LED_MAP_HARNESS,
# and delete src/ + Kconfig + CMakeLists.txt along with the cmake/kconfig
# lines in zephyr/module.yml.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_KLOR_LED_MAP_HARNESS=y
CONFIG_ZMK_LOG_LEVEL_DBG=y

# Do NOT add CONFIG_WS2812_STRIP here. Zephyr 4.1 split that symbol into
# per-transport ones (WS2812_STRIP_SPI / _I2S / _GPIO), so the old name is
# undefined and Zephyr treats assigning an undefined symbol as a hard error,
# not a warning -- it aborts the whole build.
#
# Nothing needs to replace it: WS2812_STRIP_SPI is "default y" as soon as a
# worldsemi,ws2812-spi node exists in the devicetree, which the board overlay
# provides, and ZMK_RGB_UNDERGLOW already selects LED_STRIP. Letting the
# devicetree drive it is also what stops this breaking again on the next
# Zephyr rename.

# MUST stay n on this board: the OLEDs share the external power rail with the
# LED strip, so letting RGB gate that rail kills both displays.
#
# The failure is not obvious from the option name. In rgb_underglow.c:
#
#     zmk_rgb_underglow_off()  ->  ext_power_disable()
#
# and the idle handler calls it on the way *into* idle AND on the way out
# again whenever RGB was off before idling:
#
#     if (awake) { rgb_was_on ? underglow_on() : underglow_off(); }
#     else       { rgb_was_on = state.on; underglow_off(); }
#
# With RGB_UNDERGLOW_ON_START=n the strip is never on, so both branches call
# off(). External power is cut after the first 30 s idle and then cut again on
# every wake -- it is never re-enabled. The OLEDs light up at boot, die at the
# first idle, and typing does not bring them back.
#
# Setting this to n means the strip keeps drawing quiescent current whenever
# external power is on. That is the price of having working displays; the two
# cannot be separated because they are on the same rail.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Lit from boot, and extinguished while idle. Together these give the closest
# thing mainline ZMK has to "the lights come on when I type": the strip is on
# whenever the keyboard is ACTIVE and off after CONFIG_ZMK_IDLE_TIMEOUT (30 s)
# without input, returning on the next keypress.
#
# It is genuinely not per-key. The hardware could do it -- there are 21 LEDs,
# one per key -- but mainline ZMK has exactly four whole-strip effects (solid,
# breathe, spectrum, swirl) and the underglow subsystem subscribes only to
# zmk_activity_state_changed, never to individual key events. Per-key reactive
# lighting needs a custom module.
#
# AUTO_OFF_IDLE is only safe because RGB_UNDERGLOW_EXT_POWER is n above. With
# it y, this same setting is what cut the OLED power rail and never restored it.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# 60%, deliberately under the measured ceiling. White is the most expensive
# colour on this board -- all three dies lit on all 21 LEDs, north of 100 mA
# -- and the supply cannot hold it up indefinitely. Measured on USB, white
# stays clean to 70% and goes pink above that as green and blue starve while
# red, which has the lowest forward voltage, survives. 60 leaves margin for
# battery operation, which has less headroom than USB.
#
# If you want more brightness, use a saturated colour instead: at saturation
# 100 only one die lights per LED, roughly a third of the current.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=60

# White. Saturation 0 washes out the hue entirely, so HUE_START no longer
# matters -- it is left at its default rather than set to a misleading value.
#
# Note this only applies to a board with no saved RGB state. ZMK persists
# hue/sat/brt/effect to settings and restores them over these defaults at
# boot, so an already-running board needs &rgb_ug RGB_SAD (SYS position 34)
# pressed ten times instead, which is equivalent and persists the same way.
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=0

# Display blanking is left at its default, which is "y if SSD1306". The OLEDs
# go dark after the same 30 s idle as the RGB and wake on the next keypress.
# Set CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n if you would rather they stayed lit.

# --- Battery ------------------------------------------------------------
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# If USB serial logging is ever needed again, do NOT set ZMK_USB_LOGGING here.
# It selects USB_CDC_ACM and UART_CONSOLE, which depend on
# DT_HAS_ZEPHYR_CDC_ACM_UART_ENABLED, and nothing in this config creates a
# zephyr,cdc-acm-uart node -- the symbols get y-selected with unmet
# dependencies and Zephyr aborts the build.
#
# It ships as a ZMK snippet instead, which supplies both the devicetree node
# and the Kconfig. Add "snippet: zmk-usb-logging" to the klor_left entry in
# build.yaml, plus CONFIG_ZMK_LOG_LEVEL_DBG=y here for detail. Left half only:
# the right is a peripheral, where ZMK_USB cannot be enabled.
